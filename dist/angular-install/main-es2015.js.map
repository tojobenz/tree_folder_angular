export default "<div class=\"max-w-3xl mx-auto my-10 px-5\" *ngIf=\"currentUser; else loggedOut\">\r\n    <header class=\"bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-8 rounded-2xl mb-8 shadow-lg\">\r\n      <div class=\"flex items-center gap-5\">\r\n        <div class=\"w-20 h-20 bg-white/20 rounded-full flex items-center justify-center border-[3px] border-white/30\">\r\n          <svg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\r\n            <path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/>\r\n            <circle cx=\"12\" cy=\"7\" r=\"4\"/>\r\n          </svg>\r\n        </div>\r\n        <h3 class=\"m-0 text-2xl font-bold\">\r\n          <strong>{{ currentUser.name }}</strong> Profile\r\n        </h3>\r\n      </div>\r\n    </header>\r\n    <div class=\"flex flex-col gap-4\">\r\n      <p class=\"text-lg text-gray-700 p-5 bg-white rounded-xl shadow-sm flex items-center gap-3\">\r\n        <strong class=\"text-indigo-500 font-semibold min-w-[80px]\">Email:</strong>\r\n        {{ currentUser.email }}\r\n      </p>\r\n      <p class=\"text-lg text-gray-700 p-5 bg-white rounded-xl shadow-sm flex items-center gap-3\">\r\n        <strong class=\"text-indigo-500 font-semibold min-w-[80px]\">Roles:</strong>\r\n        {{ currentUser.roles }}\r\n      </p>\r\n    </div>\r\n  </div>\r\n  \r\n  <ng-template #loggedOut>\r\n    <div class=\"text-center py-16 text-gray-500\">\r\n      <svg width=\"80\" height=\"80\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" class=\"mx-auto mb-5 text-indigo-400\">\r\n        <circle cx=\"12\" cy=\"12\" r=\"10\"/>\r\n        <line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/>\r\n        <line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/>\r\n      </svg>\r\n      <p class=\"text-xl\">Please login.</p>\r\n    </div>\r\n  </ng-template>\r\n  "
