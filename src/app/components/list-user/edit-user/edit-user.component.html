
<section *ngIf="!isSuccessful" >

  <form *ngIf="currentData" class="edit-form">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-8 col-xl-6">
        <div class="row">
          <div class="col text-center">
            <h1>Modification utilisateur</h1>
            <p class="text-h3">Modification</p>
          </div>
        </div>
        <div class="row align-items-center">
          <div class="col mt-4">
            <label for="name">Nom</label>
            <input
              type="text"
              class="form-control"
              id="name"
              [(ngModel)]="currentData.name"
              name="name"
            />
          </div>
        </div>
        <div class="row align-items-center mt-4">
          <div class="col">
            <label for="email">email</label>
            <input
              type="text"
              class="form-control"
              id="email"
              [(ngModel)]="currentData.email"
              name="email"
            />
          </div>
        </div>
        <div class="row align-items-center">
          <div class="col mt-4">
            <label for="password">mot de passe</label>
          <div class="row">
            <div class="col-md-10">
              <input
              type="text"
              class="form-control"
              id="password"
              name="password"
              [(ngModel)]="currentData.password"
            />

            </div>
            <div class="col-md-2">

    <button type="button" class="btn btn-success" (click)="uuid()">générer</button>
            </div>
          </div>
          </div>
        </div>


        <div class="row justify-content-start mt-4">
          <div class="col">

            
  <button class="btn btn-warning mr-2" (click)="deleteTutorial()">
    Delete
  </button>

  <button type="submit" class="btn btn-primary" (click)="updateUser()">
    Update
  </button>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</form>

</section>
<div class="alert alert-success" *ngIf="isSuccessful">
  {{message}}
</div>
<div id="preloader" *ngIf="load">
  <div id="loader"></div>
</div>
