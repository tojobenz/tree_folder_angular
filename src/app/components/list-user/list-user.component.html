<div class="p-8 bg-gray-50 rounded-2xl my-5">
  <h2 class="text-center text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600 mb-8">Liste des utilisateurs</h2>
  
  <div class="flex flex-wrap gap-4 mb-6">
    <div class="flex-1 min-w-[200px]">
      <div class="flex gap-2">
        <input
          type="text"
          class="flex-1 px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all"
          placeholder="Rechercher email..."
          #val
          (click)="refresh()"
        />
        <button
          class="px-4 py-2 border-2 border-gray-300 text-gray-600 rounded-lg font-semibold hover:bg-gray-100 transition-all"
          type="button"
          (click)="searchTitle(val.value)"
        >
          Rechercher
        </button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span>Nombre de pages:</span>
      <select (change)="handlePageSizeChange($event)" class="px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all cursor-pointer">
        <option *ngFor="let size of pageSizes" [ngValue]="size">
          {{ size }}
        </option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white rounded-xl overflow-hidden shadow-sm">
      <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-6 py-4">
        <h3 class="font-semibold">Utilisateurs</h3>
      </div>
      <ul class="divide-y divide-gray-200">
        <li
          class="px-6 py-4 hover:bg-indigo-50 transition-colors cursor-pointer"
          *ngFor="let tutorial of tutorials| paginate : {
            itemsPerPage: pageSize,
            currentPage: page,
            totalItems: count
          }; let i = index"
          [class.bg-indigo-100]="i == currentIndex"
          (click)="setActiveTutorial(tutorial, i)"
        >
          {{ tutorial.email }}
        </li>
      </ul>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-6" *ngIf="currentTutorial">
      <h3 class="text-xl font-bold text-gray-800 mb-6">Description</h3>
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <strong class="text-indigo-500 font-semibold min-w-[80px]">Nom:</strong>
          <span class="text-gray-700">{{ currentTutorial.name }}</span>
        </div>
        <div class="flex items-center gap-3">
          <strong class="text-indigo-500 font-semibold min-w-[80px]">Email:</strong>
          <span class="text-gray-700">{{ currentTutorial.email }}</span>
        </div>
        <div class="flex items-center gap-3">
          <strong class="text-indigo-500 font-semibold min-w-[80px]">Status:</strong>
          <span class="text-gray-700">
            <span *ngIf="currentTutorial.roles === '3'" class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-medium">Admin</span>
            <span *ngIf="currentTutorial.roles === '2'" class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium">Utilisateur</span>
            <span *ngIf="currentTutorial.roles === '1'" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-medium">Super Admin</span>
          </span>
        </div>
      </div>

      <button class="mt-6 px-6 py-3 bg-gradient-to-r from-yellow-500 to-orange-500 text-white rounded-xl font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all" (click)="editUser(currentTutorial.id)">
        Modifier
      </button>
    </div>
  </div>

  <div class="flex justify-center mt-8">
    <pagination-controls
      previousLabel="Prev"
      nextLabel="Next"
      responsive="true"
      (pageChange)="handlePageChange($event)"
    ></pagination-controls>
  </div>
</div>
