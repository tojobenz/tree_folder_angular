<section>

    <form
    *ngIf="!isSuccessful"
    name="form"
    (ngSubmit)="f.form.valid && onSubmit()"
    #f="ngForm"
    novalidate
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-8 col-xl-6">
          <div class="row">
            <div class="col text-center">
              <h1>Nouveau cabinet</h1>
              <p class="text-h3">enregistrement</p>
            </div>
          </div>
          <div class="row align-items-center">
            <div class="col mt-4">
              <label for="name">Nom</label>
              <input
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="form.name"
                required
                minlength="3"
                maxlength="20"
                #name="ngModel"
              />
              <div class="alert-danger" *ngIf="f.submitted && name.invalid">
                <div *ngIf="name.errors.required">Veuillez saisir le nom</div>
                <div *ngIf="name.errors.minlength">
                  Le nom doit contenir au moins 3 caractères
                </div>
                <div *ngIf="name.errors.maxlength">
                  Ne doit pas depasser 20 caractères
                </div>
              </div>
            </div>
          </div>


          <div class="row justify-content-start mt-4">
            <div class="col">

              <button class="btn btn-primary mt-4">Enregistrer</button>
            </div>
          </div>
          
        </div>
      </div>
    </div>
    <div class="alert alert-warning" *ngIf="f.submitted && isSignUpFailed">
      cette nom est déjà utiliser<br />{{ errorMessage }}
    </div>
  </form>

  <div class="alert alert-success" *ngIf="isSuccessful">
    Succès de l'enregistrement
  </div>
  </section>
