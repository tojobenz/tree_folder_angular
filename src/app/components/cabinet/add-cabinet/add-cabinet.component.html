<section class="min-h-screen bg-gray-50 py-10">
    <form
    *ngIf="!isSuccessful"
    name="form"
    (ngSubmit)="f.form.valid && onSubmit()"
    #f="ngForm"
    novalidate
    class="max-w-2xl mx-auto"
  >
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Nouveau cabinet</h1>
        <p class="text-gray-600">enregistrement</p>
      </div>
      
      <div class="mb-6">
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nom</label>
        <input
          type="text"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50"
          name="name"
          [(ngModel)]="form.name"
          required
          minlength="3"
          maxlength="20"
          #name="ngModel"
          placeholder="Entrez le nom du cabinet"
        />
        <div class="text-red-500 text-sm mt-2" *ngIf="f.submitted && name.invalid">
          <div *ngIf="name.errors.required">Veuillez saisir le nom</div>
          <div *ngIf="name.errors.minlength">
            Le nom doit contenir au moins 3 caractères
          </div>
          <div *ngIf="name.errors.maxlength">
            Ne doit pas dépasser 20 caractères
          </div>
        </div>
      </div>

      <div class="flex justify-start">
        <button class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
          Enregistrer
        </button>
      </div>
    </div>
    
    <div class="bg-yellow-100 border border-yellow-300 text-yellow-800 px-4 py-3 rounded-xl mt-4" *ngIf="f.submitted && isSignUpFailed">
      ce nom est déjà utilisé<br />{{ errorMessage }}
    </div>
  </form>

  <div class="bg-green-100 border border-green-300 text-green-800 px-4 py-3 rounded-xl max-w-2xl mx-auto" *ngIf="isSuccessful">
    Succès de l'enregistrement
  </div>
</section>
