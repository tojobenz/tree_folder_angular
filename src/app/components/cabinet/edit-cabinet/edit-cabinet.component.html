

<section *ngIf="!load">

    <form *ngIf="currentData" class="edit-form"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-8 col-xl-6">
          <div class="row">
            <div class="col text-center">
              <h1>Modification utilisateur</h1>
              <p class="text-h3">Modification</p>
            </div>
          </div>
          <div class="row align-items-center">
            <div class="col mt-4">
              <label for="name">Nom</label>
              <input
                type="text"
                class="form-control"
                id="name"
                [(ngModel)]="currentData.name"
                name="name"
              />
            </div>
          </div>  
          <div class="row justify-content-start mt-4">
            <div class="col">
  
    <button type="submit" class="btn btn-primary" (click)="updateUser()">
      Update
    </button>
    <p>{{ message }}</p>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </form>
  
  </section>

  <div id="preloader" *ngIf="load">
    <div id="loader"></div>
  </div>
