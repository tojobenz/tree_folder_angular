<section *ngIf="!load" class="min-h-screen bg-gray-50 py-10">
  <form *ngIf="currentData" class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Modification cabinet</h1>
        <p class="text-gray-600">Modification</p>
      </div>

      <div class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nom</label>
          <input
            type="text"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50"
            id="name"
            [(ngModel)]="currentData.name"
            name="name"
          />
        </div>

        <div class="flex gap-4 pt-4">
          <button type="submit" class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all" (click)="updateUser()">
            Modifier
          </button>
        </div>

        <div class="bg-green-100 border border-green-300 text-green-800 px-4 py-3 rounded-xl" *ngIf="message">
          {{ message }}
        </div>
      </div>
    </div>
  </form>
</section>

<div class="fixed inset-0 flex items-center justify-center bg-white bg-opacity-95 z-50" *ngIf="load">
  <div class="w-40 h-40 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
</div>
