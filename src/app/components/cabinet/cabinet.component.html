<div class="p-8 bg-gray-50 rounded-2xl my-5" *ngIf="!load">
  <h2 class="text-center text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600 mb-8">Liste des cabinets</h2>
  <div class="flex flex-wrap gap-4 mb-6">
    <div>
      <button class="px-4 py-2 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-lg font-semibold hover:shadow-lg transition-all w-[150px]" (click)="addCabinet()">Nouvelle cabinet</button>
    </div>
    <div class="flex items-center gap-2">
      <span>Nombre de pages:</span>
      <select (change)="handlePageSizeChange($event)" class="px-3 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all cursor-pointer">
        <option *ngFor="let size of pageSizes" [ngValue]="size">
          {{ size }}
        </option>
      </select>
    </div>
    <div class="flex-1 min-w-[200px]">
      <div class="flex gap-2">
        <input
          type="text"
          class="flex-1 px-4 py-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all"
          placeholder="Rechercher email..."
          #val
          (click)="refresh()"
        />
        <button
          class="px-4 py-2 border-2 border-gray-300 text-gray-600 rounded-lg font-semibold hover:bg-gray-100 transition-all"
          type="button"
          (click)="searchTitle(val.value)"
        >
          Rechercher
        </button>
      </div>
    </div>
  </div>
  
  <div class="bg-white rounded-xl overflow-hidden shadow-sm">
    <table class="w-full">
      <thead class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white">
        <tr>
          <th class="px-6 py-4 font-semibold text-left"></th>
          <th class="px-6 py-4 font-semibold text-left">Nom</th>
          <th class="px-6 py-4 font-semibold text-left"></th>
          <th class="px-6 py-4 font-semibold text-left"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users| paginate : {
          itemsPerPage: pageSize,
          currentPage: page,
          totalItems: count
        }; let i = index" class="border-b border-gray-200 hover:bg-indigo-50 transition-colors" [class.bg-indigo-100]="i == currentIndex">
          <td class="px-6 py-4">{{i}}</td>
          <td class="px-6 py-4">{{user.name}}</td>
          <td class="px-6 py-4">
            <button class="px-4 py-2 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-lg font-semibold hover:shadow-lg transition-all" (click)="deleteUser(user)">Supprimer</button>
          </td>
          <td class="px-6 py-4">
            <button class="px-4 py-2 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-lg font-semibold hover:shadow-lg transition-all ml-5" (click)="editCabinet(user.id)">Modifier</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-center mt-8">
    <pagination-controls
      previousLabel="Prev"
      nextLabel="Next"
      responsive="true"
      (pageChange)="handlePageChange($event)"
    ></pagination-controls>
  </div>
</div>

<div class="fixed inset-0 flex items-center justify-center bg-white bg-opacity-95 z-50" *ngIf="load">
  <div class="w-40 h-40 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
</div>
