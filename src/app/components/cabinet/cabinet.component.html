<div class="col-md-12 user-container" *ngIf="!load">
  <h2 style="margin: auto"> Liste des cabinets</h2>
  <div class="row">
    <div class="col-md-4">
      <button class="btn btn-danger" style="width:150px" (click)="addCabinet()">Nouvelle cabinet</button></div>
    <div class="col-md-4 mb-3">     Nombre de pages:
        <select (change)="handlePageSizeChange($event)">
          <option *ngFor="let size of pageSizes" [ngValue]="size">
            {{ size }}
          </option>
        </select>

      </div>
        <div class="col-md-4">
          <div class="input-group mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Rechercher email..."
              #val
              (click)="refresh()"
            />
            <div class="input-group-append">
              <button
                class="btn btn-outline-secondary"
                type="button"
                (click)="searchTitle(val.value)"
              >
                Rechercher
              </button>
            </div>
          </div>
        </div>
</div>
  <table class="table table-striped">
    <thead>
    <tr>
      <th></th>
      <th>Nom</th>
      <th></th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users| paginate : {
      itemsPerPage: pageSize,
      currentPage: page,
      totalItems: count
    }; let i = index"  [class.active]="i == currentIndex">
      <td>{{i}}</td>
      <td>{{user.name}}</td>
      <td><button class="btn btn-danger" (click)="deleteUser(user)">Supprimer</button></td>
      <td>
        <button class="btn btn-success" (click)="editCabinet(user.id)" style="margin-left: 20px;">Modifier</button></td>
    </tr>
    </tbody>
  </table>

  <div class="col-md-12">
    <pagination-controls
      previousLabel="Prev"
      nextLabel="Next"
      responsive="true"
      (pageChange)="handlePageChange($event)"
    ></pagination-controls>
  </div>

</div>
<div id="preloader" *ngIf="load">
  <div id="loader"></div>
</div>
