<div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
  <div class="px-6 py-5 bg-gradient-to-r from-indigo-500 to-purple-600 text-white">
    <h4 class="m-0 text-xl font-semibold">{{title || 'Ajout d\'un fichier'}}</h4>
  </div>
  <div class="p-6">
    <div class="mb-5">
      <label for="fileInput" class="block text-sm font-semibold text-gray-700 mb-2">{{question || 'Sélectionnez un fichier'}}</label>
      <input 
        type="file" 
        id="fileInput"
        class="w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50 cursor-pointer hover:border-indigo-400"
        (change)="onFileChange($event)" 
        accept=".pdf,.doc,.docx,.txt,.jpg,.png,.jpeg"
        #fileInput>
      <small class="block mt-2 text-sm text-gray-500">
        Formats acceptés: PDF, DOC, DOCX, TXT, JPG, PNG (Max 10MB)
      </small>
    </div>
    
    <div class="mb-5">
      <label for="messageInput" class="block text-sm font-semibold text-gray-700 mb-2">Message (optionnel)</label>
      <input 
        type="text" 
        id="messageInput"
        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50"
        [(ngModel)]="message" 
        name="message" 
        placeholder="Ajouter une description...">
    </div>
    
    <div class="mt-4" *ngIf="files && files.length > 0">
      <div class="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-xl">
        <i class="fa fa-file mr-2"></i>
        <strong>Fichier sélectionné:</strong> {{files[0].name}}
        <br>
        <small>Taille: {{formatFileSize(files[0].size)}}</small>
      </div>
    </div>
  </div>
  <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
    <button 
      type="button" 
      class="px-4 py-2 border-2 border-red-300 text-red-500 rounded-lg font-semibold hover:bg-red-50 transition-all"
      (click)="close()">
      Annuler
    </button>
    <button 
      type="button" 
      class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg font-semibold hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="apply()"
      [disabled]="!isValid()">
      Confirmer
    </button>
  </div>
</div>
