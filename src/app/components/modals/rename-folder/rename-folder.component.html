<div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
    <div class="px-6 py-5 bg-gradient-to-r from-indigo-500 to-purple-600 text-white">
      <h4 class="m-0 text-xl font-semibold">{{title || 'Prompt'}}</h4>
    </div>
    <div class="p-6">
      <label class="block text-sm font-semibold text-gray-700 mb-2">{{question}}</label>
      <input type="text" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50" [(ngModel)]="message" name="name" />
    </div>
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
      <button type="button" class="px-4 py-2 border-2 border-red-300 text-red-500 rounded-lg font-semibold hover:bg-red-50 transition-all" (click)="fermer()">Annuler</button>
      <button type="button" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg font-semibold hover:shadow-lg transition-all" (click)="apply()">Confirmer</button>
    </div>
  </div>
