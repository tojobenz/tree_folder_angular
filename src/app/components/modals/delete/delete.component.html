<div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
    <div class="px-6 py-5 bg-gradient-to-r from-red-500 to-red-600 text-white">
      <h4 class="m-0 text-xl font-semibold">{{title || 'Confirm'}}</h4>
    </div>
    <div class="p-6 text-center">
      <p class="m-0 text-lg text-gray-700 leading-relaxed">{{message || 'Are you sure?'}}</p>
    </div>
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-center gap-3">
      <button type="button" class="px-5 py-2 border-2 border-red-300 text-red-500 rounded-lg font-semibold hover:bg-red-50 transition-all min-w-[120px]" (click)="cancel()">Annuler</button>
      <button type="button" class="px-5 py-2 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-lg font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all min-w-[120px]" (click)="confirm()">Confirmer</button>
    </div>
  </div>
