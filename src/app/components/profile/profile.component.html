<div class="max-w-3xl mx-auto my-10 px-5" *ngIf="currentUser; else loggedOut">
    <header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-8 rounded-2xl mb-8 shadow-lg">
      <div class="flex items-center gap-5">
        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center border-[3px] border-white/30">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h3 class="m-0 text-2xl font-bold">
          <strong>{{ currentUser.name }}</strong> Profile
        </h3>
      </div>
    </header>
    <div class="flex flex-col gap-4">
      <p class="text-lg text-gray-700 p-5 bg-white rounded-xl shadow-sm flex items-center gap-3">
        <strong class="text-indigo-500 font-semibold min-w-[80px]">Email:</strong>
        {{ currentUser.email }}
      </p>
      <p class="text-lg text-gray-700 p-5 bg-white rounded-xl shadow-sm flex items-center gap-3">
        <strong class="text-indigo-500 font-semibold min-w-[80px]">Roles:</strong>
        {{ currentUser.roles }}
      </p>
    </div>
  </div>
  
  <ng-template #loggedOut>
    <div class="text-center py-16 text-gray-500">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-auto mb-5 text-indigo-400">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p class="text-xl">Please login.</p>
    </div>
  </ng-template>
