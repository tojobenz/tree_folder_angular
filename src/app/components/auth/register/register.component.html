<section *ngIf="!load" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 p-5">
  <div class="w-full max-w-lg">
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-8">
        <div class="mb-5 flex justify-center">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="url(#gradient2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8.5" cy="7" r="4" stroke="url(#gradient2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="20" y1="8" x2="20" y2="14" stroke="url(#gradient2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="23" y1="11" x2="17" y2="11" stroke="url(#gradient2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="gradient2" x1="0" y1="0" x2="24" y2="21" gradientUnits="userSpaceOnUse">
                <stop stop-color="#667eea"/>
                <stop offset="1" stop-color="#764ba2"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Créer un compte</h1>
        <p class="text-gray-600">Rejoignez-nous en quelques secondes</p>
      </div>

      <form
        *ngIf="!isSuccessful"
        name="form"
        (ngSubmit)="f.form.valid && onSubmit()"
        #f="ngForm"
        novalidate
        class="space-y-6"
      >
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nom</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 z-10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              class="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50"
              name="name"
              [(ngModel)]="form.name"
              required
              minlength="3"
              maxlength="20"
              #name="ngModel"
              placeholder="Entrez votre nom"
            />
          </div>
          <div class="text-red-500 text-sm mt-1 flex items-center gap-1" *ngIf="f.submitted && name.invalid">
            <span *ngIf="name.errors.required">Nom requis</span>
            <span *ngIf="name.errors.minlength">Minimum 3 caractères</span>
            <span *ngIf="name.errors.maxlength">Maximum 20 caractères</span>
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 z-10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              class="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50"
              name="email"
              [(ngModel)]="form.email"
              required
              email
              #email="ngModel"
              placeholder="Entrez votre email"
            />
          </div>
          <div class="text-red-500 text-sm mt-1 flex items-center gap-1" *ngIf="f.submitted && email.invalid">
            <span *ngIf="email.errors.required">Email requis</span>
            <span *ngIf="email.errors.email">Format email invalide</span>
          </div>
        </div>

        <div>
          <label for="cabinet_id" class="block text-sm font-semibold text-gray-700 mb-2">Cabinet</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 z-10" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 21h18"/>
              <path d="M5 21V7l8-4 8 4v14"/>
              <path d="M17 21v-8.5a1.5 1.5 0 0 0-1.5-1.5h-7a1.5 1.5 0 0 0-1.5 1.5V21"/>
            </svg>
            <select
              name="cabinet_id"
              [(ngModel)]="form.cabinet_id"
              required
              #cabinet_id="ngModel"
              class="w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all bg-gray-50 cursor-pointer appearance-none"
            >
              <option value="" disabled selected>Sélectionnez un cabinet</option>
              <option *ngFor="let cab of cabinet" value="{{ cab.id }}">{{cab.name}}</option>
            </select>
          </div>
          <div class="text-red-500 text-sm mt-1 flex items-center gap-1" *ngIf="f.submitted && cabinet_id.invalid">
            <span *ngIf="cabinet_id.errors.required">Cabinet requis</span>
          </div>
        </div>

        <div class="mt-4">
          <div class="flex items-center gap-3">
            <input type="checkbox" class="hidden" name="check" [(ngModel)]="form.check" #check="ngModel" id="check">
            <label class="flex items-center gap-3 cursor-pointer text-gray-600" for="check">
              <span class="w-6 h-6 border-2 border-gray-300 rounded-lg flex items-center justify-center transition-all bg-gray-50" [class.bg-gradient-to-r]="form.check" [class.from-indigo-500]="form.check" [class.to-purple-600]="form.check" [class.border-indigo-500]="form.check">
                <svg *ngIf="form.check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
              <span>Compte administrateur</span>
            </label>
          </div>
        </div>

        <div class="space-y-4 pt-2">
          <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-3 px-6 rounded-xl font-semibold hover:shadow-lg transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
            <span>Créer mon compte</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-xl flex items-center gap-2" *ngIf="f.submitted && isSignUpFailed">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Erreur: {{ errorMessage }}</span>
        </div>
      </form>

      <div class="bg-green-100 border border-green-300 text-green-700 px-4 py-3 rounded-xl flex items-center gap-2" *ngIf="isSuccessful">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>Compte créé avec succès!</span>
      </div>
    </div>
  </div>
</section>

<div class="fixed inset-0 flex items-center justify-center bg-white bg-opacity-95 z-50" *ngIf="load">
  <div class="w-40 h-40 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
</div>
