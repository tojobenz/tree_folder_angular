  <section *ngIf="!load">

    <form
    *ngIf="!isSuccessful"
    name="form"
    (ngSubmit)="f.form.valid && onSubmit()"
    #f="ngForm"
    novalidate
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-8 col-xl-6">
          <div class="row">
            <div class="col text-center">
              <h1>Nouvelle utilisateur</h1>
              <p class="text-h3">enregistrement</p>
            </div>
          </div>
          <div class="row align-items-center">
            <div class="col mt-4">
              <label for="name">Nom</label>
              <input
                type="text"
                class="form-control"
                name="name"
                [(ngModel)]="form.name"
                required
                minlength="3"
                maxlength="20"
                #name="ngModel"
              />
              <div class="alert-danger" *ngIf="f.submitted && name.invalid">
                <div *ngIf="name.errors.required"></div>
                <div *ngIf="name.errors.minlength">
                  Le nom doit au moins 3 caractères
                </div>
                <div *ngIf="name.errors.maxlength">
                  Le nom ne doit pas depasser 20 caractères
                </div>
              </div>
            </div>
          </div>
          <div class="row align-items-center mt-4">
            <div class="col">
                 <label for="email">Email</label>
          <input
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="form.email"
            required
            email
            #email="ngModel"
          />
          <div class="alert-danger" *ngIf="f.submitted && email.invalid">
            <div *ngIf="email.errors.required">Veuillez completer</div>
            <div *ngIf="email.errors.email">
              Veuillez respecter le format de l'email
            </div>
          </div>
            </div>
          </div>

          <div class="row align-items-center">
            <div class="col mt-4">
              <label for="email">Cabinet</label>
              <select      
              name="cabinet_id"
              [(ngModel)]="form.cabinet_id"
              required
              cabinet_id
              #cabinet_id="ngModel"
               class="form-control">
                <option value=""disabled selected>Veuillez selectionnez un cabinet</option>
          <option *ngFor="let cab of cabinet" value="{{ cab.id }}">{{cab.name}}</option>
          </select>
              <div class="alert-danger" *ngIf="f.submitted && cabinet_id.invalid">
                <div *ngIf="cabinet_id.errors.required">Veuillez completer</div>
                <div *ngIf="cabinet_id.errors.cabinet_id">
                  Le cabinet ne doit pas être vide
                </div>
              </div>
            </div>
          </div>

          <div class="row align-items-center mt-4">
            <div class="col">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" name="check" [(ngModel)]="form.check"
            check
            #check="ngModel">
            <label class="form-check-label" for="check">Admin?</label>
          </div>
            </div>
          </div>
          


          <div class="row justify-content-start mt-4">
            <div class="col">

              <button class="btn btn-primary mt-4">Enregistrer</button>
            </div>
          </div>
          
        </div>
      </div>
    </div>
    <div class="alert alert-warning" *ngIf="f.submitted && isSignUpFailed">
      Erreur de l'enregistrement!<br />{{ errorMessage }}
    </div>
  </form>

  <div class="alert alert-success" *ngIf="isSuccessful">
    Succès de l'enregistrement
  </div>
  </section>
  <div id="preloader" *ngIf="load">
    <div id="loader"></div>
  </div>
